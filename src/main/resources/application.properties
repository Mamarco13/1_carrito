spring.application.name=1_carrito

# DATABASE - PostgreSQL (configurable via variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carrito_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
# Actualizar la base de datos y modifica las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
# Muestra en terminal las consultas
spring.jpa.show-sql=true
# Informa a Hibernate sobre la sintaxis SQL específica de PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# THYMELEAF
# ¿Qué es Thymeleaf? --> Motor de plantillas
# Desactiva el caché de Thymeleaf para ver los cambios en tiempo real
spring.thymeleaf.cache=false
# Indica la carpeta donde se encuentran las plantillas
spring.thymeleaf.prefix=classpath:/templates/
# Indica la extensión de los archivos de plantilla
spring.thymeleaf.suffix=.html

# SECURITY
# Nombre de usuario por defecto
spring.security.user.name=admin
# Contraseña por defecto
spring.security.user.password=admin
# Roles del usuario --> ADMIN (Administrador), USER (Usuario)
spring.security.user.roles=ADMIN