spring.application.name=1_carrito

# DATABASE - PostgreSQL (configurable via variables de entorno)
# Local/Docker Compose: se pueden usar SPRING_DATASOURCE_* o los valores por defecto.
# Render: el blueprint inyecta DB_HOST, DB_PORT, DB_NAME, DB_USER y DB_PASSWORD
#         (ver render.yaml) y aqui se construye la URL JDBC a partir de ellos.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carrito_db}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
# Actualizar la base de datos y modifica las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
# Muestra en terminal las consultas
spring.jpa.show-sql=true
# Informa a Hibernate sobre la sintaxis SQL específica de PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# THYMELEAF
# ¿Qué es Thymeleaf? --> Motor de plantillas
# Desactiva el caché de Thymeleaf para ver los cambios en tiempo real
spring.thymeleaf.cache=false
# Indica la carpeta donde se encuentran las plantillas
spring.thymeleaf.prefix=classpath:/templates/
# Indica la extensión de los archivos de plantilla
spring.thymeleaf.suffix=.html

# SECURITY
# Nombre de usuario por defecto
spring.security.user.name=admin
# Contraseña por defecto
spring.security.user.password=admin
# Roles del usuario --> ADMIN (Administrador), USER (Usuario)
spring.security.user.roles=ADMIN

# SERVIDOR
# Render asigna el puerto mediante la variable PORT (por defecto 10000).
# En local no existe PORT, asi que se usa 8080.
server.port=${PORT:8080}