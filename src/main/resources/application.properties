spring.application.name=1_carrito

# DATABASE
# URL de la base de datos --> testdb en memoria (se borra al reiniciar)
spring.datasource.url=jdbc:h2:mem:testdb
# Driver de la base de datos
spring.datasource.driverClassName=org.h2.Driver
# Usuario de la base de datos
spring.datasource.username=sa
# Contraseña de la base de datos
spring.datasource.password=password
# Habilitar la consola de H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
# Actualizar la base de datos y modifica las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
# Muestra en terminal las consultas
spring.jpa.show-sql=true
# Informa a Hibernate sobre la sintaxis SQL específica del motor H2.
# ¿Qué es Hibernate? --> ORM (Object-Relational Mapping)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# THYMELEAF
# ¿Qué es Thymeleaf? --> Motor de plantillas
# Desactiva el caché de Thymeleaf para ver los cambios en tiempo real
spring.thymeleaf.cache=false
# Indica la carpeta donde se encuentran las plantillas
spring.thymeleaf.prefix=classpath:/templates/
# Indica la extensión de los archivos de plantilla
spring.thymeleaf.suffix=.html

# SECURITY
# Nombre de usuario por defecto
spring.security.user.name=admin
# Contraseña por defecto
spring.security.user.password=admin
# Roles del usuario --> ADMIN (Administrador), USER (Usuario)
spring.security.user.roles=ADMIN