<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="${product.id != null} ? 'Editar Producto' : 'Añadir Producto'">Formulario Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="Inicio" width="30" height="30">
                <span class="ms-2">DSS carrito</span>
            </a>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/products}">Catálogo</a>
                    </li>
                    <li sec:authorize="isAuthenticated()" class="nav-item">
                        <a class="nav-link" th:href="@{/cart}">
                            Carrito
                            <span class="badge bg-primary ms-1"
                                th:text="${@cartService.getCartItemCount(#authentication.principal.username)}"></span>
                        </a>
                    </li>
                </ul>

                <!-- User Dropdown -->
                <ul class="navbar-nav ms-auto">
                    <li sec:authorize="!isAuthenticated()" class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-person" viewBox="0 0 16 16">
                                <path
                                    d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z" />
                            </svg>
                            <span class="ms-1">Cuenta</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" th:href="@{/login}">Iniciar Sesión</a></li>
                            <li><a class="dropdown-item" th:href="@{/register}">Registrarse</a></li>
                        </ul>
                    </li>

                    <li sec:authorize="isAuthenticated()" class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-person-fill" viewBox="0 0 16 16">
                                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                            </svg>
                            <span class="ms-1" sec:authentication="principal.username"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <h6 class="dropdown-header">Mi Cuenta</h6>
                            </li>
                            <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item"
                                    th:href="@{/products/add}">Administrar Productos</a></li>
                            <li><a class="dropdown-item" th:href="@{/cart}">Mi Carrito</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="dropdown-item">Cerrar Sesión</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="card-title mb-0"
                            th:text="${product.id != null} ? 'Editar Producto' : 'Añadir Nuevo Producto'">
                            Formulario de Producto
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form
                            th:action="${product.id != null} ? @{/products/edit/{id}(id=${product.id})} : @{/products/add}"
                            method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}">

                            <!-- No necesitamos campo oculto para ID porque va en la URL -->

                            <!-- Nombre del producto -->
                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre del Producto:</label>
                                <input type="text" id="name" name="name" class="form-control" th:value="${product.name}"
                                    required placeholder="Ej. Camiseta, Zapatillas...">
                            </div>

                            <!-- Precio del producto -->
                            <div class="mb-4">
                                <label for="price" class="form-label">Precio (€):</label>
                                <input type="number" id="price" name="price" step="0.01" min="0" class="form-control"
                                    th:value="${product.price}" required placeholder="Ej. 19.99">
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-flex justify-content-between">
                                <a href="products.html" th:href="@{/products}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success"
                                    th:text="${product.id != null} ? 'Guardar Cambios' : 'Añadir Producto'">
                                    Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
