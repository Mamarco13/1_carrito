<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Catalogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <nav class="navbar navbar-light bg-light">
            <a class="navbar-brand" href="index.html" th:href="@{/}">
                <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="Inicio" width="30" height="30">
            </a>
        </nav>
        <div class="d-flex justify-content-between align-items-center my-4">
            <h1 class="text-center mb-0">Catalogo de Productos</h1>
            <a th:href="@{/products/export}" class="btn btn-success">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-download me-1" viewBox="0 0 16 16">
                    <path
                        d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
                    <path
                        d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z" />
                </svg>
                Exportar BD
            </a>
        </div>
        <div class="mb-4">
            <a href="cart.html" th:href="@{/cart}" class="btn btn-secondary">Ver Carrito</a>
        </div>
        <div class="row">
            <div th:each="product : ${products}" class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.name}">Nombre del Producto</h5>
                        <p class="card-text" th:text="${product.price}">Precio</p>
                        <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-primary">Agregar al Carrito</button>
                        </form>

                        <!-- Botones de Administrador -->
                        <div sec:authorize="hasRole('ADMIN')" class="mt-2 d-flex justify-content-between">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}"
                                class="btn btn-warning btn-sm">Editar</a>
                            <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post"
                                style="display:inline;">
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                                    th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Seguro que deseas eliminar este producto?');">Eliminar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
